<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>{{TITLEH}}</title>
</head>

<body style="
      margin: 0;
      padding: 0;
      background-color: #e8f4fb;
      font-family: Arial, sans-serif;
    ">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#e8f4fb">
        <tr>
            <td align="center" style="padding: 30px 0">
                <table width="600" cellpadding="0" cellspacing="0" border="0" style="
              background-color: #ffffff;
              border-radius: 8px;
              overflow: hidden;
              box-shadow: 0 4px 20px rgba(0, 87, 162, 0.12);
            ">
                    <!-- Encabezado con gradiente de marca -->
                    <tr>
                        <td style="
                  background:#0057a2;
                  padding: 28px 0;
                  text-align: center;
                ">
                            <!-- <img src="cid:imgAct" alt="Encabezado" width="200"
                                style="display: block; margin: auto;" /> -->
                            <div style="
                    margin: auto;
                    border-radius: 8px;
                    width: 210px;
                    background-color: #ffffff;
                    padding: 5px;
                  ">
                                <img src="cid:imgAct" alt="Encabezado" width="200"
                                     style="display: block; margin: auto" />
                            </div>
                        </td>
                    </tr>

                    <!-- Barra decorativa delgada -->
                    <tr>
                        <td style="
                  height: 4px;
                  background:  #29aae1;
                "></td>
                    </tr>

                    <!-- Título -->
                    <tr>
                        <td style="
                  padding: 36px 48px 12px 48px;
                  color: #0057a2;
                  font-size: 22px;
                  font-weight: bold;
                  text-align: center;
                  letter-spacing: 0.3px;
                ">
                            {{TITLE}}
                        </td>
                    </tr>

                    <!-- Cuerpo -->
                    <tr>
                        <td style="
                  padding: 12px 48px 36px 48px;
                  color: #444444;
                  font-size: 15px;
                  line-height: 1.7;
                ">
                            {{BODY}}
                        </td>
                    </tr>

                    <!-- Botón -->
                    <tr>
                        <td align="center" style="padding: 0 0 40px 0">
                            <a href="{{LINK}}" style="
                    background:
                      #29aae1;
                    color: #ffffff;
                    padding: 14px 36px;
                    text-decoration: none;
                    border-radius: 6px;
                    font-weight: bold;
                    font-size: 15px;
                    display: inline-block;
                    letter-spacing: 0.5px;
                    box-shadow: 0 4px 14px rgba(0, 87, 162, 0.35);
                  ">Ir al sistema</a>
                        </td>
                    </tr>

                    <!-- Divisor -->
                    <tr>
                        <td style="padding: 0 48px">
                            <div style="height: 1px; background-color: #d6eaf8"></div>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="
                  background-color: #f0f8ff;
                  padding: 18px 48px;
                  text-align: center;
                  font-size: 12px;
                  color: #6699bb;
                  border-top: 3px solid #29aae1;
                ">
                            © {{ TEXT_FOOTER }} Todos los derechos reservados.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
